name: Newsletter

# PAUSED 2026-09-22 (owner). n1dv.io was folded into nexusonecap.com, and the
# list holds two addresses — the owner's own and a test entry. Every send since
# July reached one or two people, none of them a reader, so the automatic push
# trigger is off. The job still runs on demand; nothing has to be rebuilt to
# resume. To resume, put the push trigger back.
#
# Sending itself is untouched and works: the sender defaults to
# research@nexusonecap.com, whose Resend records (DKIM + send.nexusonecap.com)
# are live in DNS.
#
# Safe to run repeatedly: sendNewsletter.ts dedupes via the newsletter_sends
# table and skips quietly when secrets are missing or nothing is new.
on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/sendNewsletter.ts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
