name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without activity.
# This pings the Data API every 3 days so the project stays awake.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Data API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://mevrwtzquadthtbzqmdu.supabase.co/rest/v1/newsletter_subscribers?select=id&limit=1" \
            -H "apikey: sb_publishable_lzHfxlE6TbRYfiYcKTxUSw_JRHpnqoX")
          echo "Supabase responded with HTTP $code"
          # 2xx/4xx both prove the database handled the request; fail only on no response / 5xx
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then exit 1; fi
